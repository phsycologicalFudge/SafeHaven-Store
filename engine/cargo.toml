[package]
name = "safehaven_engine"
version = "1.0.0"
edition = "2021" #TODO: upgrade

[lib]
name = "safehaven_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.11.1"
ureq = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
