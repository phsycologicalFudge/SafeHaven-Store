name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag, empty dfult'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.0
        with:
          fetch-depth: 0

      - name: Determine Next Version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            latest=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            major=$(echo "$latest" | sed 's/^v//' | cut -d. -f1)
            minor=$(echo "$latest" | sed 's/^v//' | cut -d. -f2)
            patch=$(echo "$latest" | sed 's/^v//' | cut -d. -f3)
            next="v$major.$minor.$((patch + 1))"
            echo "tag=$next" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version-file: pubspec.yaml
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Patch JNI build-id
        run: |
          PUB_CACHE_DIR="${PUB_CACHE:-$HOME/.pub-cache}"
          find "$PUB_CACHE_DIR/hosted" -path "*/jni-*/src/CMakeLists.txt" -exec sed -i -e 's/-Wl,/-Wl,--build-id=none,/' {} \;

      - name: Setup Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" > android/local-signing.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/local-signing.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/local-signing.properties
          echo "storeFile=upload-keystore.jks" >> android/local-signing.properties

      - name: Build Release APK
        run: flutter build apk --release --split-per-abi

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/safehaven-store.apk

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: SafeHaven Store
          draft: true
          files: |
            build/app/outputs/flutter-apk/safehaven-store.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
