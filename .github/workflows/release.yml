name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag, empty dfult'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Next Version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            latest=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            major=$(echo "$latest" | sed 's/^v//' | cut -d. -f1)
            minor=$(echo "$latest" | sed 's/^v//' | cut -d. -f2)
            patch=$(echo "$latest" | sed 's/^v//' | cut -d. -f3)
            next="v$major.$minor.$((patch + 1))"
            echo "tag=$next" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          channel: 'stable'
          cache: true

      - name: Clone Build A
        run: |
          git clone https://github.com/${{ github.repository }}.git build-a
          git -C build-a checkout ${{ github.sha }}

      - name: Clone Build B
        run: |
          git clone https://github.com/${{ github.repository }}.git build-b
          git -C build-b checkout ${{ github.sha }}

      - name: Build A
        run: |
          cd build-a
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" > android/local-signing.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/local-signing.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/local-signing.properties
          echo "storeFile=upload-keystore.jks" >> android/local-signing.properties
          flutter pub get
          flutter build apk --release --split-per-abi

      - name: Build B
        run: |
          cd build-b
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" > android/local-signing.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/local-signing.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/local-signing.properties
          echo "storeFile=upload-keystore.jks" >> android/local-signing.properties
          flutter pub get
          flutter build apk --release --split-per-abi

      - name: Diff APK Contents
        if: always()
        run: |
          mkdir -p diff-a diff-b
          unzip -q build-a/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk -d diff-a
          unzip -q build-b/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk -d diff-b
          echo "files that differ:"
          diff -rq diff-a diff-b || true

      - name: Compare Hashes
        id: compare
        run: |
          hash_a=$(sha256sum build-a/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | cut -d ' ' -f1)
          hash_b=$(sha256sum build-b/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | cut -d ' ' -f1)
          echo "build A hash: $hash_a"
          echo "build B hash: $hash_b"
          if [ "$hash_a" != "$hash_b" ]; then
            echo "hash mismatch between build A and build B, aborting release"
            exit 1
          fi
          echo "hashes match, proceeding to release"
          echo "hash=$hash_a" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: mv build-a/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk safehaven-store.apk

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: SafeHaven Store
          draft: true
          body: |
            Verified reproducible build — SHA-256: `${{ steps.compare.outputs.hash }}`
          files: |
            safehaven-store.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}